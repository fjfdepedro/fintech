<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Generator - Crypto Market</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    h1 { margin-bottom: 5px; }
    p { color: #888; }

    .icon-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .icon {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1421 100%);
      border-radius: 20%;
      position: relative;
      overflow: hidden;
    }

    .icon::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(34, 197, 94, 0.3) 0%, transparent 50%),
                  radial-gradient(circle at 70% 70%, rgba(59, 130, 246, 0.2) 0%, transparent 50%);
    }

    .icon-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chart-icon {
      font-size: inherit;
      display: flex;
      align-items: flex-end;
      gap: 8%;
      height: 40%;
    }

    .bar {
      width: 12%;
      border-radius: 4px;
      background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
    }

    .bar:nth-child(2) { background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%); }
    .bar:nth-child(4) { background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); }

    .crypto-symbol {
      font-weight: 800;
      color: #22c55e;
      text-shadow: 0 0 30px rgba(34, 197, 94, 0.6);
      margin-top: 5%;
    }

    /* 512x512 */
    .icon-512 {
      width: 512px;
      height: 512px;
    }
    .icon-512 .bar { width: 50px; }
    .icon-512 .bar:nth-child(1) { height: 120px; }
    .icon-512 .bar:nth-child(2) { height: 180px; }
    .icon-512 .bar:nth-child(3) { height: 140px; }
    .icon-512 .bar:nth-child(4) { height: 220px; }
    .icon-512 .crypto-symbol { font-size: 72px; }

    .label {
      font-size: 14px;
      color: #666;
    }

    .instructions {
      background: #0f0f23;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #333;
    }
    code {
      background: #333;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Crypto Market - Icon Generator</h1>
  <p>512 x 512 px</p>

  <div class="icon-container">
    <div class="label">App Icon (512x512)</div>
    <div class="icon icon-512" id="icon512">
      <div class="icon-content">
        <div class="chart-icon">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
        <span class="crypto-symbol">CRYPTO</span>
      </div>
    </div>
  </div>

  <div class="instructions">
    <p><strong>F12</strong> → Elements → clic derecho en <code>&lt;div class="icon icon-512"&gt;</code> → <strong>"Capture node screenshot"</strong></p>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cover Generator - Crypto Market</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    h1 { margin-bottom: 5px; }
    p { color: #888; }

    .cover {
      width: 1024px;
      height: 576px;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0d1421 100%);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cover::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 50%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 60% 80%, rgba(245, 158, 11, 0.1) 0%, transparent 40%);
    }

    /* Animated chart lines in background */
    .chart-bg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 200px;
      opacity: 0.3;
    }

    .chart-line {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, #22c55e 20%, #22c55e 40%, #ef4444 60%, #22c55e 80%, transparent 100%);
    }

    .cover-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      text-align: center;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .chart-icon {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .bar {
      width: 20px;
      border-radius: 4px;
    }
    .bar:nth-child(1) { height: 50px; background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%); }
    .bar:nth-child(2) { height: 75px; background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%); }
    .bar:nth-child(3) { height: 55px; background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%); }
    .bar:nth-child(4) { height: 90px; background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%); }

    .title {
      font-size: 72px;
      font-weight: 800;
      background: linear-gradient(90deg, #22c55e 0%, #3b82f6 50%, #22c55e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
    }

    .subtitle {
      font-size: 28px;
      color: #9ca3af;
      font-weight: 400;
    }

    .crypto-badges {
      display: flex;
      gap: 15px;
      margin-top: 15px;
    }

    .badge {
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 18px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .badge.btc { color: #f7931a; border-color: #f7931a; }
    .badge.eth { color: #627eea; border-color: #627eea; }
    .badge.sol { color: #00ffa3; border-color: #00ffa3; }
    .badge.bnb { color: #f3ba2f; border-color: #f3ba2f; }

    .instructions {
      background: #111;
      padding: 15px 25px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    code {
      background: #333;
      padding: 2px 8px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Cover Image Generator</h1>
  <p>1024 x 576 (16:9)</p>

  <div class="cover" id="cover">
    <div class="chart-bg">
      <div class="chart-line"></div>
    </div>
    <div class="cover-content">
      <div class="logo-row">
        <div class="chart-icon">
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </div>
      </div>
      <div class="title">Crypto Market</div>
      <div class="subtitle">Real-time analysis & market insights</div>
      <div class="crypto-badges">
        <span class="badge btc">BTC</span>
        <span class="badge eth">ETH</span>
        <span class="badge sol">SOL</span>
        <span class="badge bnb">BNB</span>
      </div>
    </div>
  </div>

  <div class="instructions">
    <p><strong>F12</strong> → Elements → clic derecho en <code>&lt;div class="cover"&gt;</code> → <strong>"Capture node screenshot"</strong></p>
  </div>
</body>
</html>
